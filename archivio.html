
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Archivio Fotografico – Ciro Ciscognetti</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;

        }

        .gallery {
            max-width: 1100px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .gallery img {
            width: 100%;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        /* Modal */
        #modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
        }

        #modal img {
            display: block;
            max-width: 90%;
            max-height: 90%;
            margin: 5% auto;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        #modal:active {
            display: none;
        }
    </style>

    <script>
        function openModal(src) {
            const modal = document.getElementById('modal');
            const modalImg = document.getElementById('modal-img');
            modalImg.src = src;
            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</head>

<body>

<header>
    <h1>Archivio Fotografico</h1>
</header>

<div id="modal" onclick="closeModal()">
    <img id="modal-img" src="">
</div>
